name: Critical founder path

on:
  push:
    branches: [lovable-sync]
  pull_request:
    branches: [main, lovable-sync]

concurrency:
  group: critical-founder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck, lint critical path, and build
        run: npm run ci:critical

  mirror-main:
    name: Keep main aligned with the active source
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/lovable-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Mirror without discarding independent work
        run: |
          git fetch origin main lovable-sync
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'main contains independent work. Reconcile both histories; never force-push.'
            exit 1
          }
          git push origin HEAD:main
