name: Critical founder path

on:
  push:
    branches: [main, lovable-sync]
  pull_request:
    branches: [main, lovable-sync]

concurrency:
  group: critical-founder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck, lint critical path, and build
        run: npm run ci:critical
